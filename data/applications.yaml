# The application register for a fictional organisation, Meridian Financial
# Group. Fourteen applications, one of them out of scope.
#
# The register is deliberately imperfect in the ways real ones are. Three
# entries cannot be attested at all and the reasons differ: one owner has left,
# one owner was never in the directory, one owner cell is empty. A register
# that only contained clean rows would demonstrate nothing, because the
# interesting behaviour of this system is what it does with the rows that
# cannot produce an answer.

